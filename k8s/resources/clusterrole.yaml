apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pure-cosi-driver-role
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources:
      - bucketclasses
      - bucketclaims
      - bucketaccesses
      - buckets
      - bucketaccessclasses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources:
      - bucketclaims/status
      - bucketaccesses/status
      - buckets/status
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
