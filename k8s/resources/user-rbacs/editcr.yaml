apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cosi-bucket-creator
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups:
  - objectstorage.k8s.io
  resources:
  - bucketclaims
  - bucketaccesses
  verbs:
  - create
  - delete
  - deletecollection
  - patch
  - update
