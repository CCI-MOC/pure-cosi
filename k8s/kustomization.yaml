apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/kubernetes-sigs/container-object-storage-interface?ref=v0.2.2
  - driver

# Our FIPS build of the controller (images/cosi-controller), in place of the
# upstream staging image.
images:
  - name: gcr.io/k8s-staging-sig-storage/objectstorage-controller
    newName: ghcr.io/cci-moc/pure-cosi/cosi-controller
    newTag: v0.1.3

patches:
  - target:
      kind: Deployment
      name: container-object-storage-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: container-object-storage-controller
      spec:
        template:
          spec:
            containers:
              - name: objectstorage-controller
                resources:
                  requests:
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi
