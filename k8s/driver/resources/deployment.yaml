apiVersion: apps/v1
kind: Deployment
metadata:
  name: pure-cosi-driver
  labels:
    app.kubernetes.io/name: pure-cosi-driver
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pure-cosi-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pure-cosi-driver
      annotations:
        k8s.v1.cni.cncf.io/networks: "storage-network" # for driver to reach management API
    spec:
      serviceAccountName: pure-cosi-driver-sa
      containers:
        # COSI Provisioner Sidecar
        - name: objectstorage-sidecar
          image: registry.k8s.io/sig-storage/objectstorage-sidecar:v0.2.2
          imagePullPolicy: IfNotPresent
          env:
          - name: COSI_ENDPOINT
            value: unix:///var/lib/cosi/cosi.sock
          args:
            - "-v=4"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/cosi

        # Pure Storage FlashBlade COSI Driver
        - name: pure-cosi-driver
          image: ghcr.io/cci-moc/pure-cosi:v0.1.0
          imagePullPolicy: Always
          env:
            - name: COSI_SOCKET_PATH
              value: "/var/lib/cosi/cosi.sock"
            - name: DEBUG
              value: "true"
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - secretRef:
                name: pure-cosi-config
          volumeMounts:
            - name: socket-dir
              mountPath: /var/lib/cosi

      volumes:
        - name: socket-dir
          emptyDir: {}
